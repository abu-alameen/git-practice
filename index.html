    <!-- 
    from what i have learned on git and github,

    git is a version control system that allows developers to track changes in their codebase, collaborate with others, and manage different versions of their projects. GitHub is a web-based platform that hosts Git repositories and provides additional features for collaboration, such as pull requests, issue tracking, and project management tools.

    first, git init -- is used to initialize a new Git repository in a project directory. This command creates a .git folder that contains all the necessary files and data for version control.

    second, git add . -- is used to stage changes in the working directory for the next commit. The dot (.) indicates that all changes in the current directory and its subdirectories should be added to the staging area. and can use git add <filename> to add specific files instead of all changes.

    third, git commit -m "message" -- is used to create a new commit with a descriptive message. This command records the changes that have been staged and saves them in the repository's history.

    fourth, git status -- is used to check the current status of the repository. It shows which files have been modified, added, or deleted, and whether they are staged for the next commit.

    fifth, git log -- is used to view the commit history of the repository. It displays a list of commits, including their unique identifiers (hashes), author information, commit messages, and timestamps.

    sixth, git remote add origin <repository_url> -- is used to link a local Git repository to a remote repository hosted on a platform like GitHub. The <repository_url> should be replaced with the actual URL of the remote repository.

    seventh, git push -u origin main -- is used to upload the local commits to the remote repository. The -u flag sets the upstream tracking reference, allowing future pushes and pulls to be done without specifying the remote and branch names.

    to update a file you do git add <filename> and then git commit -m "message" and then git push -u origin main

    question: do you mean if i git add <filename> and then git commit -m "message" i must do git push -u origin main to update the file in the remote repository?
        answer: yes, after you have staged and committed your changes locally using git add and git commit, you need to use git push -u origin main (or the appropriate branch name) to upload those changes to the remote repository on GitHub. This ensures that the remote repository reflects the latest changes made in your local repository.
